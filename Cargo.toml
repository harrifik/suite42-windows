[workspace]
resolver = "2"
members = ["crates/kit42", "apps/pdf42", "apps/doc42", "apps/xls42", "apps/img42", "apps/ppt42", "apps/scn42"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Suite42 Windows port"]

[workspace.dependencies]
kit42 = { path = "crates/kit42" }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "=0.31.1"
egui_extras = { version = "=0.31.1", features = ["image"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "pnm", "qoi", "hdr", "dds"] }
lopdf = "0.34"
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
ttf-parser = "0.25"
ab_glyph = "0.2"
tiny-skia = "0.11"
encoding_rs = "0.8"
pulldown-cmark = { version = "0.12", default-features = false }
calamine = "0.26"
arboard = "3"
kamadak-exif = "0.6"
resvg = "0.44"
rayon = "1"
chrono = "0.4"
rand = "0.8"
md-5 = "0.10"
trash = "5"
tiff = "0.9"

[workspace.dependencies.windows]
version = "0.58"
features = [
  "Foundation", "Foundation_Collections", "Data_Pdf", "Storage", "Storage_Streams", "Graphics_Imaging",
  "Media_Ocr", "Globalization", "Devices_Scanners", "Devices_Enumeration",
  "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  "Win32_Globalization", "Win32_System_WinRT", "Win32_System_Console",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
